<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a1a; }
  #map { height: 100%; width: 100%; }
  #map .no-data {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #ff4444; font-size: 15px;
  }
</style>
</head>
<body>
<div id="map"></div>

<script>
const ALERTS = /*ALERTS_JSON*/null/*END_ALERTS_JSON*/;
const CITIES_DB = /*CITIES_JSON*/[]/*END_CITIES_JSON*/;

const END_OF_INCIDENT = '\u05d4\u05d0\u05d9\u05e8\u05d5\u05e2 \u05d4\u05e1\u05ea\u05d9\u05d9\u05dd';

/** OREF sometimes sends shortened names; map to cities.json keys. */
const CITY_NAME_ALIASES = {
  '\u05e2\u05db': '\u05e2\u05db\u05d5', // עכ -> עכו
};

function init() {
  const mapEl = document.getElementById('map');
  if (!ALERTS || !ALERTS.length) {
    mapEl.innerHTML = '<div class="no-data">No alert data</div>';
    return;
  }

  // Build lookup: name -> {lat, lng}
  const lookup = {};
  CITIES_DB.forEach(c => {
    if (c.lat && c.lng) {
      lookup[c.name] = { lat: c.lat, lng: c.lng };
      if (c.value && c.value !== c.name) lookup[c.value] = { lat: c.lat, lng: c.lng };
    }
  });

  const allResolved = [];

  ALERTS.forEach((alert) => {
    const alertCities = alert.data || [];
    const title = alert.title || 'Alert';
    const isEndOfIncident = title === END_OF_INCIDENT;

    alertCities.forEach(rawName => {
      const name = CITY_NAME_ALIASES[rawName] || rawName;
      let coord = lookup[name];
      if (!coord) {
        const prefix = name + ' - ';
        const key = Object.keys(lookup).find(k => k.startsWith(prefix));
        if (key) coord = lookup[key];
      }
      if (coord) {
        const point = { name: rawName, ...coord, green: isEndOfIncident };
        allResolved.push(point);
      }
    });
  });

  if (allResolved.length === 0) {
    mapEl.innerHTML = '<div class="no-data">No locations matched cities database</div>';
    return;
  }

  initLeaflet(allResolved);
}

/** Max zoom after fit: ~city / metro (street level is typically z14+). */
const MAP_MAX_ZOOM_CITY = 11;

function initLeaflet(points) {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);

  const script = document.createElement('script');
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = () => {
    const first = points[0];
    const map = L.map('map', { zoomControl: true }).setView([first.lat, first.lng], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    let bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
    const sw = bounds.getSouthWest();
    const ne = bounds.getNorthEast();
    const minSpan = 0.055;
    const latSpan = Math.max(ne.lat - sw.lat, minSpan);
    const lngSpan = Math.max(ne.lng - sw.lng, minSpan);
    const c = bounds.getCenter();
    bounds = L.latLngBounds(
      [c.lat - latSpan / 2, c.lng - lngSpan / 2],
      [c.lat + latSpan / 2, c.lng + lngSpan / 2]
    );

    const redIcon = L.divIcon({
      className: '',
      html: '<div style="background:rgba(255,50,50,0.85);border:2px solid #fff;border-radius:50%;width:14px;height:14px;box-shadow:0 0 8px rgba(255,0,0,0.6);"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    const greenIcon = L.divIcon({
      className: '',
      html: '<div style="background:rgba(50,200,50,0.85);border:2px solid #fff;border-radius:50%;width:14px;height:14px;box-shadow:0 0 8px rgba(0,200,0,0.6);"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    points.forEach(p => {
      L.marker([p.lat, p.lng], { icon: p.green ? greenIcon : redIcon })
        .bindTooltip(p.name, { direction: 'top', offset: [0, -10] })
        .addTo(map);
    });

    const resizeAndFit = () => {
      map.invalidateSize();
      if (bounds.isValid()) {
        map.fitBounds(bounds, {
          padding: [28, 28],
          maxZoom: MAP_MAX_ZOOM_CITY,
        });
      }
    };
    map.whenReady(() => {
      resizeAndFit();
      requestAnimationFrame(resizeAndFit);
      setTimeout(resizeAndFit, 150);
    });
  };
  document.head.appendChild(script);
}

init();
</script>
</body>
</html>
