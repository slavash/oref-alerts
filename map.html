<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alert Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a1a; color: #fff; }
  #map { width: 100vw; height: 100vh; }
  #info {
    position: absolute; top: 12px; left: 12px; right: 12px;
    background: rgba(30,30,30,0.92); backdrop-filter: blur(10px);
    border-radius: 12px; padding: 14px 18px; z-index: 10;
    font-size: 14px; max-height: 38vh; overflow-y: auto;
  }
  .alert-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .alert-entry:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .alert-entry h2 { font-size: 16px; margin-bottom: 4px; color: #ff4444; }
  .alert-entry .meta { color: #aaa; margin-bottom: 2px; font-size: 13px; }
  .alert-entry .cities { color: #ddd; line-height: 1.4; font-size: 13px; }
  .dot-red { background: rgba(255,50,50,0.85); border: 2px solid #fff; border-radius: 50%; width: 14px; height: 14px; }
</style>
</head>
<body>
<div id="info"></div>
<div id="map"></div>

<script>
const ALERTS = /*ALERTS_JSON*/null/*END_ALERTS_JSON*/;
const CITIES_DB = /*CITIES_JSON*/[]/*END_CITIES_JSON*/;

function init() {
  const infoEl = document.getElementById('info');
  if (!ALERTS || !ALERTS.length) {
    infoEl.innerHTML = '<h2 style="color:#ff4444">No alert data</h2>';
    return;
  }

  // Build lookup: name -> {lat, lng}
  const lookup = {};
  CITIES_DB.forEach(c => {
    if (c.lat && c.lng) {
      lookup[c.name] = { lat: c.lat, lng: c.lng };
      if (c.value && c.value !== c.name) lookup[c.value] = { lat: c.lat, lng: c.lng };
    }
  });

  const allResolved = [];

  // Render info entries for each alert
  let infoHtml = '';
  ALERTS.forEach((alert, idx) => {
    const alertCities = alert.data || [];
    const title = alert.title || 'Alert';
    const zone = alert.zone || '';

    const resolved = [];
    const unresolved = [];
    alertCities.forEach(name => {
      let coord = lookup[name];
      if (!coord) {
        const prefix = name + ' - ';
        const key = Object.keys(lookup).find(k => k.startsWith(prefix));
        if (key) coord = lookup[key];
      }
      if (coord) { resolved.push({ name, ...coord }); allResolved.push({ name, ...coord }); }
      else unresolved.push(name);
    });

    const meta = `${zone} — ${resolved.length} mapped` +
      (unresolved.length ? ` | ${unresolved.length} not found` : '');

    infoHtml += `<div class="alert-entry">
      <h2>${title}</h2>
      <div class="meta">${meta}</div>
      <div class="cities">${alertCities.join(', ')}</div>
    </div>`;
  });
  infoEl.innerHTML = infoHtml;

  if (allResolved.length === 0) return;

  // Compute bounds
  let minLat = Infinity, maxLat = -Infinity, minLng = Infinity, maxLng = -Infinity;
  allResolved.forEach(p => {
    minLat = Math.min(minLat, p.lat); maxLat = Math.max(maxLat, p.lat);
    minLng = Math.min(minLng, p.lng); maxLng = Math.max(maxLng, p.lng);
  });
  const centerLat = (minLat + maxLat) / 2;
  const centerLng = (minLng + maxLng) / 2;
  const spanLat = Math.max((maxLat - minLat) * 1.3, 0.05);
  const spanLng = Math.max((maxLng - minLng) * 1.3, 0.05);

  initLeaflet(allResolved, centerLat, centerLng, spanLat, spanLng);
}

function initLeaflet(points, cLat, cLng, sLat, sLng) {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);

  const script = document.createElement('script');
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = () => {
    const map = L.map('map', { zoomControl: true }).setView([cLat, cLng], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    const bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
    map.fitBounds(bounds.pad(0.15));

    const redIcon = L.divIcon({
      className: '',
      html: '<div style="background:rgba(255,50,50,0.85);border:2px solid #fff;border-radius:50%;width:14px;height:14px;box-shadow:0 0 8px rgba(255,0,0,0.6);"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    points.forEach(p => {
      L.marker([p.lat, p.lng], { icon: redIcon })
        .bindTooltip(p.name, { direction: 'top', offset: [0, -10] })
        .addTo(map);
    });
  };
  document.head.appendChild(script);
}

init();
</script>
</body>
</html>
