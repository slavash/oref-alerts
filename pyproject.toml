[tool.poetry]
name = "oref-alert"
version = "1.0.0"
description = "OREF emergency alert monitor with macOS map popup"
authors = []
readme = "README.md"
packages = [{include = "_alert"}]

[tool.poetry.dependencies]
python = "^3.9"
pyobjc-framework-Cocoa = {version = ">=9.0", markers = "sys_platform == 'darwin'"}
pyobjc-framework-WebKit = {version = ">=9.0", markers = "sys_platform == 'darwin'"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pylint = ">=2.17"

[tool.poetry.scripts]
oref-alert = "alert:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.messages_control]
disable = ["import-error"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
min-public-methods = 1
